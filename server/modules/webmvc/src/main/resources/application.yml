spring:
  application:
    name: transnote-server
  datasource:
    url: jdbc:postgresql://localhost:5433/transnote   # 宿主 5433（5432 被 ai-copilot 占用）
    username: dev
    password: dev
  jpa:
    hibernate:
      ddl-auto: none   # schema 由 Flyway 管理
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
