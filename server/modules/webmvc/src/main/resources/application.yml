spring:
  application:
    name: transnote-server
  datasource:
    url: jdbc:postgresql://localhost:5433/transnote   # 宿主 5433（5432 被 ai-copilot 占用）
    username: dev
    password: dev
  jpa:
    hibernate:
      ddl-auto: none   # schema 由 Flyway 管理
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

transnote:
  llm:
    enabled: false               # true 时启用 OpenAI 兼容 LLM 抽取（§8.3）
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
  asset:
    storage-dir: ${TRANS_NOTE_ASSET_DIR:./data/assets}   # MVP 本地；生产切 MinIO/S3（§8.4）
