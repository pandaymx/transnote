# TransNote 开发依赖环境（2026-09-06 定版）
# PostgreSQL 18（19 未 GA）、Valkey 9.1.2（替代 Redis 7）、MinIO latest（S3 兼容）
# 镜像默认走 daocloud 加速（国内 Docker Hub 直连不通）；切官方源：IMAGE_PREFIX="" 或 export IMAGE_PREFIX= 后 up
# 用法：docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: ${IMAGE_PREFIX:-docker.m.daocloud.io}/library/postgres:18
    container_name: transnote-postgres
    environment:
      POSTGRES_DB: transnote
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"   # 宿主 5432 已被 ai-copilot 项目占用，transnote 用 5433
    volumes:
      - pgdata:/var/lib/postgresql   # PG18+ 镜像要求挂载根目录，数据在子目录（旧路径 /data 会报错退出）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d transnote"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: ${IMAGE_PREFIX:-docker.m.daocloud.io}/valkey/valkey:9.1.2
    container_name: transnote-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ${IMAGE_PREFIX:-docker.m.daocloud.io}/minio/minio:latest   # 跟随最新 RELEASE（生产建议固定 RELEASE.yyyy-mm-dd 标签）
    container_name: transnote-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: devdevdev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  valkeydata:
  miniodata:
