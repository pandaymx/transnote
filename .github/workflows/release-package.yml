name: Release Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要上传产物的 tag（缺省取最新 tag）
        required: false
        type: string

jobs:
  linux-package:
    name: Linux deb/rpm 打包
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装前端依赖
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: 解析目标 tag
        id: ver
        run: |
          V="${{ github.event.inputs.tag }}"
          if [ -z "$V" ]; then V=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0); fi
          echo "tag=${V#v}" >> "$GITHUB_OUTPUT"
      - name: Tauri bundle（deb + rpm）
        working-directory: apps/desktop
        run: bunx tauri build --bundles deb rpm --config "{\"version\":\"${{ steps.ver.outputs.tag }}\"}"
      - name: 上传安装包到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release upload "v${TAG}" apps/desktop/src-tauri/target/release/bundle/deb/*.deb \
            --clobber || { gh release create "v${TAG}" apps/desktop/src-tauri/target/release/bundle/deb/*.deb --title "TransNote v${TAG}" --notes "自动构建产物"; }
      - uses: actions/upload-artifact@v4
        with:
          name: transnote-linux-deb-v${{ steps.ver.outputs.tag }}
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows-package:
    name: Windows nsis/msi 打包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装前端依赖
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: 解析目标 tag
        id: ver
        shell: bash
        run: |
          V="${{ github.event.inputs.tag }}"
          if [ -z "$V" ]; then V=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0); fi
          echo "tag=${V#v}" >> "$GITHUB_OUTPUT"
      - name: Tauri bundle（nsis + msi）
        working-directory: apps/desktop
        shell: bash
        run: bunx tauri build --bundles nsis msi --config "{\"version\":\"${{ steps.ver.outputs.tag }}\"}"
      - name: 上传安装包到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release upload "v${TAG}" apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe apps/desktop/src-tauri/target/release/bundle/msi/*.msi \
            --clobber || true
      - uses: actions/upload-artifact@v4
        with:
          name: transnote-windows-v${{ steps.ver.outputs.tag }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
