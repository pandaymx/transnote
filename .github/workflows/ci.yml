name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: transnote
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d transnote"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/transnote
      SPRING_DATASOURCE_USERNAME: dev
      SPRING_DATASOURCE_PASSWORD: dev
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: spotless 格式校验
        working-directory: server
        run: ./gradlew spotlessCheck --no-daemon --console=plain
      - name: 构建与测试
        working-directory: server
        run: ./gradlew clean build --no-daemon --console=plain

  web:
    name: Web build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 类型检查
        run: bunx tsc --noEmit -p apps/web
      - name: Next 构建
        run: bun --cwd apps/web build

  desktop:
    name: Desktop rust & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: 安装前端依赖
        run: bun install --frozen-lockfile
      - name: 类型检查
        run: bunx tsc --noEmit -p apps/desktop/tsconfig.json
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check

  desktop-bundle:
    name: Desktop bundle (deb/rpm)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [desktop]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装前端依赖
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: 安装 tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: 计算打包版本（git tag，缺省 0.0.0）
        id: ver
        run: |
          V=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          echo "version=${V:-0.0.0}" >> "$GITHUB_OUTPUT"
      - name: Tauri bundle（deb + rpm 安装包）
        working-directory: apps/desktop
        run: bunx tauri build --bundles deb rpm --config "{\"version\":\"${{ steps.ver.outputs.version }}\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: transnote-desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows-bundle:
    name: Windows nsis/msi 打包
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装前端依赖
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: 计算打包版本（git tag，缺省 0.0.0）
        id: ver
        shell: bash
        run: |
          V=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          echo "version=${V:-0.0.0}" >> "$GITHUB_OUTPUT"
      - name: Tauri bundle（nsis + msi 安装包）
        working-directory: apps/desktop
        shell: bash
        run: bunx tauri build --bundles nsis msi --config "{\"version\":\"${{ steps.ver.outputs.version }}\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: transnote-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 校验最近提交
        run: bunx commitlint --from HEAD~20 --to HEAD

  release:
    name: Semantic release
    # 排除 semantic-release 自动提交，防二次发布循环（[skip ci] 对 GITHUB_TOKEN push 不总是生效）
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: [server, commitlint, desktop-bundle, windows-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 拉取 Linux 安装包
        uses: actions/download-artifact@v4
        with:
          name: transnote-desktop-linux
          path: release-assets/linux
      - name: 拉取 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          name: transnote-desktop-windows
          path: release-assets/windows
      - name: semantic-release（CHANGELOG + tag + Release 附安装包）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
