name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: transnote
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d transnote"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/transnote
      SPRING_DATASOURCE_USERNAME: dev
      SPRING_DATASOURCE_PASSWORD: dev
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: spotless 格式校验
        working-directory: server
        run: ./gradlew spotlessCheck --no-daemon --console=plain
      - name: 构建与测试
        working-directory: server
        run: ./gradlew clean build --no-daemon --console=plain

  web:
    name: Web build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 类型检查
        run: bunx tsc --noEmit -p apps/web
      - name: Next 构建
        run: bun --cwd apps/web build

  desktop:
    name: Desktop rust & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: 安装前端依赖
        run: bun install --frozen-lockfile
      - name: 类型检查
        run: bunx tsc --noEmit -p apps/desktop/tsconfig.json
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check

  desktop-bundle:
    name: Desktop bundle (deb)
    runs-on: ubuntu-latest
    needs: [desktop]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装前端依赖
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 计算打包版本（git tag，缺省 0.0.0）
        id: ver
        run: |
          V=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          echo "version=${V:-0.0.0}" >> "$GITHUB_OUTPUT"
      - name: Tauri bundle（deb 安装包）
        working-directory: apps/desktop
        run: bunx tauri build --bundles deb --config "{\"version\":\"${{ steps.ver.outputs.version }}\"}"
      - uses: actions/upload-artifact@v4
        with:
          name: transnote-desktop-deb-v${{ steps.ver.outputs.version }}
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 校验最近提交
        run: bunx commitlint --from HEAD~20 --to HEAD

  release:
    name: Semantic release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [server, commitlint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: semantic-release（CHANGELOG + tag）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
