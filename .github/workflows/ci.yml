name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: transnote
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d transnote"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/transnote
      SPRING_DATASOURCE_USERNAME: dev
      SPRING_DATASOURCE_PASSWORD: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: spotless 格式校验
        working-directory: server
        run: ./gradlew spotlessCheck --no-daemon --console=plain
      - name: 构建与测试
        working-directory: server
        run: ./gradlew clean build --no-daemon --console=plain

  commitlint:
    name: Commit message lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 校验最近提交
        run: bunx commitlint --from HEAD~20 --to HEAD

  release:
    name: Semantic release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [server, commitlint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: semantic-release（CHANGELOG + tag）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
